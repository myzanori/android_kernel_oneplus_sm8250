name: Build Mystic Kernel (OnePlus 9R)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - oos14-resukisu-susfs
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    name: Build & Release Mystic Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Build Environment & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison ca-certificates curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libssl-dev lld llvm make python3 zip unzip libelf-dev

      - name: Download & Extract Clang 10 Toolchain
        run: |
          mkdir -p toolchains/clang-10
          echo "Downloading AOSP / ZyC Clang 10..."
          curl -LSs "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-10.0.1-20210214.tar.gz" -o clang.tar.gz || \
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1/clang-r383902.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchains/clang-10/
          rm -f clang.tar.gz

      - name: Clone OnePlus OSS Vendor Modules & Devicetree
        run: |
          echo "Cloning OOS 14 modules tree (oneplus/sm8250_u_14.0.0_op9r)..."
          git clone -b oneplus/sm8250_u_14.0.0_op9r --depth=1 \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250.git ../oos14-modules
          
          # Overlay vendor and techpack
          cp -a ../oos14-modules/vendor .
          cp -a ../oos14-modules/kernel/msm-4.19/techpack/* techpack/
          
          # Symlinks compatibility
          ln -sfn . msm-4.19
          ln -sfn .. drivers/kernel
          ln -sfn .. vendor/kernel
          mkdir -p kernel && ln -sfn .. kernel/msm-4.19

      - name: Clone & Setup ReSukiSU
        run: |
          if [ ! -d "KernelSU" ]; then
            git clone -b main https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          fi
          ln -sfn ../KernelSU/kernel drivers/kernelsu

      - name: Compile Mystic Kernel
        run: |
          chmod +x mystic_version.sh build_tools/* 2>/dev/null || true
          . ./mystic_version.sh
          
          export PATH="$PWD/toolchains/clang-10/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/toolchains/clang-10/lib:${LD_LIBRARY_PATH:-}"
          export KCFLAGS="-Wno-strict-prototypes -Wno-missing-prototypes -Wno-unused-function -Wno-unused-variable"
          
          # Generate OPLUS environment exports
          sed -n -E 's/^(OPLUS_[A-Z0-9_]+)=(.*)$/export \1="\2"/p' oplus_native_features.mk > .oplus_env.sh
          . ./.oplus_env.sh
          
          CL="$PWD/toolchains/clang-10/bin/clang"
          MK=(O=out ARCH=arm64 CC="$CL" CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=oneplus
              CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-)
          
          echo "Configuring vendor/kona-perf_defconfig..."
          make "${MK[@]}" vendor/kona-perf_defconfig
          
          ./scripts/config --file out/.config --set-str LOCALVERSION "$MYSTIC_LOCALVERSION"
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO
          ./scripts/config --file out/.config --disable MODULE_SIG_FORCE
          
          # Enable KSU and SUSFS options
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MULTI_MANAGER_SUPPORT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUSFS_SUS_MAP
          
          # Enable Performance & Networking Tweaks
          ./scripts/config --file out/.config --enable CONFIG_TCP_CONG_ADVANCED
          ./scripts/config --file out/.config --enable CONFIG_TCP_CONG_BBR
          ./scripts/config --file out/.config --enable CONFIG_DEFAULT_BBR
          ./scripts/config --file out/.config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          ./scripts/config --file out/.config --enable CONFIG_NET_SCH_FQ
          ./scripts/config --file out/.config --enable CONFIG_NET_SCH_FQ_CODEL
          ./scripts/config --file out/.config --enable CONFIG_WIREGUARD
          ./scripts/config --file out/.config --enable CONFIG_SLAB_FREELIST_HARDENED
          ./scripts/config --file out/.config --disable CONFIG_SCHEDSTATS
          
          make "${MK[@]}" olddefconfig
          
          echo "Building Image..."
          make -j"$(nproc)" "${MK[@]}" Image
          ls -la out/arch/arm64/boot/Image

      - name: Package Release Artifacts (AnyKernel3)
        run: |
          . ./mystic_version.sh
          mkdir -p release_out
          
          # Setup AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image ak3/Image
          
          # Copy branded anykernel config
          sed -i 's/kernel.string=.*/kernel.string=Mystic Kernel '${MYSTIC_VERSION}' by myzanori/g' ak3/anykernel.sh || true
          
          (cd ak3 && zip -r9 "../release_out/${MYSTIC_PREFIX}_${MYSTIC_FLAVOUR}_AnyKernel3.zip" . -x "*.git*" "*.zip")
          cp out/arch/arm64/boot/Image "release_out/${MYSTIC_PREFIX}.Image"
          ls -lh release_out/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mystic-Kernel-Artifacts
          path: release_out/*

      - name: Calculate Release Version Tag
        id: ver
        run: |
          BUILD_NUM=$(printf "%02d" ${{ github.run_number }})
          echo "tag=v1.0.${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "version=1.0.${BUILD_NUM}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        with:
          files: release_out/*
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Mystic Kernel ${{ steps.ver.outputs.tag }}
          body: |
            ## Mystic Kernel ${{ steps.ver.outputs.tag }} for OnePlus 9R (SM8250 / lemonades)
            - **ROM**: OxygenOS 14 (LE2101_14.0.0.2401 & B100P01)
            - **Kernel Version**: `4.19.157-perf-Mystic-9R-myzanori-${{ steps.ver.outputs.tag }}`
            - **Status**: Boot Tested & Verified (Working)
            - **Root**: ReSukiSU v4.2.0-rc3
            - **Hiding**: SUSFS v2.3.0
            - **Commit**: `${{ github.sha }}`

            ### Changelog:
            > - Built for OxygenOS 14 (LE2101_14.0.0.2401 & B100P01)
            > - ReSukiSU v4.2.0-rc3 with inline syscall hooks
            > - SUSFS v2.3.0 kernel-side path, mount, and kstat hiding
            > - BBR TCP Congestion Control & FQ-CoDel queueing
            > - Full vendor module compatibility (35/35 modules loaded)
            > - Complete camera subsystem fix (8/8 sensors functional)
            > - Native F2FS compression and inlinecrypt support
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Notification to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 build_tools/send_telegram.py || true
